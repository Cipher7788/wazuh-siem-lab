name: Validate lab files

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils shellcheck
      - name: Check XML and Bash
        shell: bash
        run: |
          xmllint --noout configs/{server,windows,linux}/*.xml
          shellcheck scripts/*.sh
