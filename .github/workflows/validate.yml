name: Validate lab files

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils shellcheck
      - name: Check XML, Bash, and Python
        shell: bash
        run: |
          xmllint --noout configs/{server,windows,linux}/*.xml
          shellcheck scripts/*.sh
          python3 -m py_compile scripts/test-lab-rules.py
          python3 scripts/test_lab_rules_unit.py
